name: Publications service control

# Start, stop or inspect the Publications publisher units on the VPS.
#
# This exists because there is no SSH access from the development environment:
# the units are on the server, and this is the only channel to them. It prints
# no secret values, only unit states and key names.
#
# Why a stop is needed at all: the unit runs `drain`, which claims a job through
# claim_publication_job. That function and the publication_* tables come from
# supabase/migrations/20260920120000_publication_events_and_lock.sql, which is
# applied by hand. Until it is applied, every timer tick fails. Leaving the timer
# enabled would just repeat a known failure every minute.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'status | probe | stop | start'
        required: true
        default: status
        type: choice
        options: [status, probe, report, fill, stop, start]

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Control
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          ACTION: ${{ inputs.action }}
          FILL_DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "ACTION='$ACTION' bash -s" <<'REMOTE' 2>&1 | sed -E \
            -e 's/vps-[0-9a-f]{6,}/<vps>/g' \
            -e 's#/home/[a-z][a-z0-9_-]*#/home/<user>#g' \
            -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g'
          set -uo pipefail

          case "$ACTION" in
            stop)
              echo "### Спиране"
              sudo systemctl disable --now aicc-publications.timer
              sudo systemctl stop aicc-publications.service
              ;;
            start)
              echo "### Пускане"
              sudo systemctl daemon-reload
              sudo systemctl enable --now aicc-publications.timer
              sudo systemctl start aicc-publications.service
              ;;
            status)
              echo "### Само проверка"
              ;;
            probe)
              echo "### Проверка на браузъра"
              ;;
            report)
              echo "### Доклад на опашката"
              ;;
            fill)
              echo "### Сухо попълване на формата"
              ;;
          esac

          echo
          echo "### Състояние на браузърните unit-и"
          for U in aicc-publications-display aicc-publications-browser aicc-publications-vnc aicc-publications-vnc-web; do
            printf '%-34s active=%-10s enabled=%s\n' "$U" \
              "$(systemctl is-active "$U.service" 2>&1)" \
              "$(systemctl is-enabled "$U.service" 2>&1)"
          done
          echo
          echo "### Процеси"
          pgrep -a Xvfb 2>/dev/null | head -3 || echo "(няма Xvfb)"
          pgrep -a chrome 2>/dev/null | head -3 | cut -c1-120 || echo "(няма Chrome)"
          echo
          echo "### CDP на 9222 отговаря ли"
          if curl -sf --max-time 5 http://127.0.0.1:9222/json/version 2>/dev/null; then
            echo "  → CDP жие"
          else
            echo "  → CDP НЕ отговаря"
          fi
          echo
          echo "### Порт 9222 слуша ли"
          (sudo ss -ltnp 2>/dev/null || ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ":9222|:6080|:5900" || echo "(нищо не слуша на 9222/6080/5900)"

          if [ "$ACTION" = "probe" ]; then
            # browser-test is run through systemd rather than `sudo -u ubuntu env`,
            # because the previous attempt there produced an empty environment and
            # died on index.mjs line 9 before it ever opened the form. A transient
            # unit reads the same EnvironmentFile production reads, so this also
            # proves the real credential path instead of a hand-built one.
            echo
            echo "### Пускам browser-test през systemd"
            sudo tee /etc/systemd/system/aicc-publications-probe.service >/dev/null <<'PROBE'
          [Unit]
          Description=One-off Publications browser probe (read-only, publishes nothing)
          After=network-online.target

          [Service]
          Type=oneshot
          User=ubuntu
          WorkingDirectory=/home/ubuntu/auto-import-control-center/services/publications-publisher
          Environment=DISPLAY=:99
          EnvironmentFile=/etc/aicc-publications.env
          # /usr/bin/env resolves node at exec time; systemd does not expand $(...).
          ExecStart=/usr/bin/env node src/index.mjs browser-test
          TimeoutStartSec=240
          PROBE
            sudo systemctl daemon-reload
            sudo systemctl reset-failed aicc-publications-probe.service 2>/dev/null || true
            sudo systemctl start aicc-publications-probe.service || true
            # browser-test drives a real remote browser and can take minutes, so
            # poll instead of guessing a sleep. Capped so a hung run cannot hold
            # the deploy open for ever.
            for _ in $(seq 1 60); do
              sudo systemctl is-active --quiet aicc-publications-probe.service || break
              sleep 5
            done
            sudo journalctl -u aicc-publications-probe.service -n 80 --no-pager 2>&1 | tail -80
            echo
            printf 'probe резултат: %s\n' "$(systemctl show aicc-publications-probe.service -p Result --value 2>/dev/null)"
          fi

          if [ "$ACTION" = "fill" ]; then
            # Dry run against the live Mobile.bg form: fills step one and stops.
            # It never submits and never attaches photos, so no listing can be
            # created by this action. Prints the page's own chosen option text.
            echo
            echo "### Сухо попълване (без submit, без снимки)"
            echo "Чернова: $FILL_DRAFT_ID"
            sudo tee /etc/systemd/system/aicc-publications-fill.service >/dev/null <<FILL
          [Unit]
          Description=One-off Publications dry form fill (never submits)
          After=network-online.target

          [Service]
          Type=oneshot
          User=ubuntu
          WorkingDirectory=/home/ubuntu/auto-import-control-center/services/publications-publisher
          EnvironmentFile=/etc/aicc-publications.env
          ExecStart=/usr/bin/env node src/index.mjs fill-test $FILL_DRAFT_ID
          TimeoutStartSec=600
          FILL
            sudo systemctl daemon-reload
            sudo systemctl reset-failed aicc-publications-fill.service 2>/dev/null || true
            sudo systemctl start aicc-publications-fill.service || true
            for _ in $(seq 1 90); do
              sudo systemctl is-active --quiet aicc-publications-fill.service || break
              sleep 5
            done
            sudo journalctl -u aicc-publications-fill.service -n 200 --no-pager 2>&1 | tail -120
            printf 'сухо попълване резултат: %s\n' "$(systemctl show aicc-publications-fill.service -p Result --value 2>/dev/null)"
          fi

          if [ "$ACTION" = "report" ]; then
            # Read-only: counts and statuses only, so it is safe to run at any
            # time and tells us which gate the chain stops at.
            echo
            echo "### Доклад на изолираните publication_* таблици"
            sudo tee /etc/systemd/system/aicc-publications-report.service >/dev/null <<'REPORT'
          [Unit]
          Description=One-off Publications queue report (read-only)
          After=network-online.target

          [Service]
          Type=oneshot
          User=ubuntu
          WorkingDirectory=/home/ubuntu/auto-import-control-center/services/publications-publisher
          EnvironmentFile=/etc/aicc-publications.env
          ExecStart=/usr/bin/env node src/queue-report.mjs
          TimeoutStartSec=120
          REPORT
            sudo systemctl daemon-reload
            sudo systemctl reset-failed aicc-publications-report.service 2>/dev/null || true
            sudo systemctl start aicc-publications-report.service || true
            sudo journalctl -u aicc-publications-report.service -n 200 --no-pager 2>&1 | tail -120
            printf 'доклад резултат: %s\n' "$(systemctl show aicc-publications-report.service -p Result --value 2>/dev/null)"
          fi

          echo
          echo "### Състояние"
          printf 'aicc-publications.timer    %s\n' "$(systemctl is-active aicc-publications.timer 2>&1)"
          printf 'aicc-publications.service  %s\n' "$(systemctl is-active aicc-publications.service 2>&1)"
          printf 'timer enabled?             %s\n' "$(systemctl is-enabled aicc-publications.timer 2>&1)"
          echo
          echo "### Последни редове в дневника"
          sudo journalctl -u aicc-publications.service -n 12 --no-pager 2>&1 | tail -12
          echo
          echo "### Ключове в /etc/aicc-publications.env (само имена)"
          sudo sed -n 's/^\([A-Z_][A-Z0-9_]*\)=.*/\1/p' /etc/aicc-publications.env 2>/dev/null || echo "(файлът липсва)"
          printf 'права: %s\n' "$(sudo stat -c '%a' /etc/aicc-publications.env 2>/dev/null || echo '-')"
          REMOTE