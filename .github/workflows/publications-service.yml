name: Publications service control

# Start, stop or inspect the Publications publisher units on the VPS.
#
# This exists because there is no SSH access from the development environment:
# the units are on the server, and this is the only channel to them. It prints
# no secret values, only unit states and key names.
#
# Why a stop is needed at all: the unit runs `drain`, which claims a job through
# claim_publication_job. That function and the publication_* tables come from
# supabase/migrations/20260920120000_publication_events_and_lock.sql, which is
# applied by hand. Until it is applied, every timer tick fails. Leaving the timer
# enabled would just repeat a known failure every minute.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'stop | start | status'
        required: true
        default: status
        type: choice
        options: [status, stop, start]

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Control
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          ACTION: ${{ inputs.action }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "ACTION='$ACTION' bash -s" <<'REMOTE' 2>&1 | sed -E \
            -e 's/vps-[0-9a-f]{6,}/<vps>/g' \
            -e 's#/home/[a-z][a-z0-9_-]*#/home/<user>#g' \
            -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g'
          set -uo pipefail

          case "$ACTION" in
            stop)
              echo "### Спиране"
              sudo systemctl disable --now aicc-publications.timer
              sudo systemctl stop aicc-publications.service
              ;;
            start)
              echo "### Пускане"
              sudo systemctl daemon-reload
              sudo systemctl enable --now aicc-publications.timer
              sudo systemctl start aicc-publications.service
              ;;
            status)
              echo "### Само проверка"
              ;;
          esac

          echo
          echo "### Състояние"
          printf 'aicc-publications.timer    %s\n' "$(systemctl is-active aicc-publications.timer 2>&1)"
          printf 'aicc-publications.service  %s\n' "$(systemctl is-active aicc-publications.service 2>&1)"
          printf 'timer enabled?             %s\n' "$(systemctl is-enabled aicc-publications.timer 2>&1)"
          echo
          echo "### Последни редове в дневника"
          sudo journalctl -u aicc-publications.service -n 12 --no-pager 2>&1 | tail -12
          echo
          echo "### Ключове в /etc/aicc-publications.env (само имена)"
          sudo sed -n 's/^\([A-Z_][A-Z0-9_]*\)=.*/\1/p' /etc/aicc-publications.env 2>/dev/null || echo "(файлът липсва)"
          printf 'права: %s\n' "$(sudo stat -c '%a' /etc/aicc-publications.env 2>/dev/null || echo '-')"
          REMOTE