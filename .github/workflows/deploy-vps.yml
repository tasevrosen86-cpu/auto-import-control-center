name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployments share one VPS and temporary archive names. They must never run in
# parallel, otherwise one run can remove another run's archive mid-upload.
concurrency:
  group: aicc-vps-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build website
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare publisher environment
        env:
          MOBILE_BG_USERNAME: ${{ secrets.MOBILE_BG_USERNAME }}
          MOBILE_BG_PASSWORD: ${{ secrets.MOBILE_BG_PASSWORD }}
        run: |
          umask 077
          {
            printf 'SUPABASE_URL=%s\n' 'https://cgftjqwebvddtsbcbeml.supabase.co'
            printf 'SUPABASE_ANON_KEY=%s\n' 'sb_publishable_3szh1-AiAAUYDeVBwO7bJQ_gXhkBU0A'
            printf 'MOBILE_BG_USERNAME=%s\n' "$MOBILE_BG_USERNAME"
            printf 'MOBILE_BG_PASSWORD=%s\n' "$MOBILE_BG_PASSWORD"
            printf 'MOBILE_BG_USER_DATA_DIR=%s\n' '/home/ubuntu/.local/share/aicc-mobile-bg'
            printf 'MOBILE_BG_HEADLESS=true\n'
            printf 'WORKER_NAME=%s\n' 'aicc-mobile-publisher'
          } > mobile-publisher.env

      # The Publications section keeps its own environment file. It is a
      # separate secret set on purpose: the Browser Use token must never be
      # mixed into the «Обяви» publisher, and the two flows are not meant to
      # share a session. Values are written here, scp'd, and deleted locally, so
      # no key reaches the repository, the frontend bundle or the build log.
      - name: Prepare publications environment
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          BROWSER_USE_PROFILE: ${{ secrets.BROWSER_USE_PROFILE }}
          PUBLICATIONS_CONTACT_PHONE: ${{ secrets.PUBLICATIONS_CONTACT_PHONE }}
          PUBLICATIONS_DESCRIPTION: ${{ secrets.PUBLICATIONS_DESCRIPTION }}
          PUBLICATIONS_CDP_URL: ${{ secrets.PUBLICATIONS_CDP_URL }}
          PUBLICATIONS_CHROME_EXECUTABLE_PATH: ${{ secrets.PUBLICATIONS_CHROME_EXECUTABLE_PATH }}
        run: |
          umask 077
          if [ -z "$BROWSER_USE_API_KEY" ]; then
            echo "::warning::BROWSER_USE_API_KEY е празна. Публикациите ще падат на локален браузър, който Mobile.bg блокира."
          fi
          {
            printf 'BROWSER_USE_API_KEY=%s\n' "$BROWSER_USE_API_KEY"
            printf 'BROWSER_USE_PROFILE=%s\n' "${BROWSER_USE_PROFILE:-mobilebg-publisher}"
            printf 'SUPABASE_URL=%s\n' 'https://cgftjqwebvddtsbcbeml.supabase.co'
            printf 'SUPABASE_ANON_KEY=%s\n' 'sb_publishable_3szh1-AiAAUYDeVBwO7bJQ_gXhkBU0A'
            printf 'PUBLICATIONS_CONTACT_PHONE=%s\n' "${PUBLICATIONS_CONTACT_PHONE:-0887353653}"
            printf 'PUBLICATIONS_DESCRIPTION=%s\n' "${PUBLICATIONS_DESCRIPTION:-!!!реална крайна цена!!!}"
            printf 'PUBLICATIONS_WORKER_NAME=%s\n' 'aicc-publications-publisher'
            printf 'PUBLICATIONS_BROWSER_MODE=%s\n' 'cdp'
            printf 'PUBLICATIONS_CDP_URL=%s\n' 'http://127.0.0.1:9222'
            printf 'PUBLICATIONS_CHROME_EXECUTABLE_PATH=%s\n' "$PUBLICATIONS_CHROME_EXECUTABLE_PATH"
            printf 'PUBLICATIONS_CHROME_USER_DATA_DIR=%s\n' '/home/ubuntu/.local/share/aicc-publications-chrome'
            printf 'PUBLICATIONS_REAL_PUBLISH_ENABLED=%s\n' 'false'
          } > publications.env

      - name: Upload and activate website, workers and publisher
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          tar -C dist -czf dist.tar.gz .
          tar -C services/source-intake-worker -czf worker.tar.gz src package.json
          tar -C services/mobile-publisher -czf mobile-publisher.tar.gz src package.json package-lock.json
          tar -C services/publications-publisher -czf publications-publisher.tar.gz src package.json package-lock.json
          scp -P "$VPS_PORT" dist.tar.gz worker.tar.gz mobile-publisher.tar.gz mobile-publisher.env \
            publications-publisher.tar.gz publications.env "$VPS_USER@$VPS_HOST:/tmp/"

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          APP_DIR="/home/ubuntu/auto-import-control-center"
          PUBLISHER_DIR="$APP_DIR/services/mobile-publisher"

          mkdir -p /tmp/auto-import-control-center-dist
          tar -xzf /tmp/dist.tar.gz -C /tmp/auto-import-control-center-dist
          sudo cp -a /tmp/auto-import-control-center-dist/. /var/www/html/

          mkdir -p "$APP_DIR/services/source-intake-worker"
          tar -xzf /tmp/worker.tar.gz -C "$APP_DIR/services/source-intake-worker"

          # Find the already-installed URL worker by its code directory, rather
          # than assuming a unit name. This avoids starting either publisher.
          SOURCE_INTAKE_UNIT=""
          for UNIT_NAME in $(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '$1 ~ /(source|intake|worker|import)/ {print $1}'); do
            UNIT_INFO="$(sudo systemctl show "$UNIT_NAME" --property=ExecStart --property=WorkingDirectory --value 2>/dev/null || true)"
            if printf '%s' "$UNIT_INFO" | grep -q "$APP_DIR/services/source-intake-worker"; then
              SOURCE_INTAKE_UNIT="$UNIT_NAME"
              break
            fi
          done
          # Existing production deployments name the intake worker
          # snapd.autoimport.service. Keep it as a narrowly scoped fallback:
          # do not ever select either Mobile.bg publisher service here.
          if [ -z "$SOURCE_INTAKE_UNIT" ] && sudo systemctl cat snapd.autoimport.service >/dev/null 2>&1; then
            SOURCE_INTAKE_UNIT="snapd.autoimport.service"
            echo "Using existing URL intake worker unit: $SOURCE_INTAKE_UNIT"
          fi
          if [ -z "$SOURCE_INTAKE_UNIT" ]; then
            echo "::error::URL intake worker unit was not found on the server."
            echo "Candidate units:"
            systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '$1 ~ /(source|intake|worker|import)/ {print $1}' || true
            exit 1
          fi
          if ! sudo systemctl start "$SOURCE_INTAKE_UNIT"; then
            sudo journalctl -u "$SOURCE_INTAKE_UNIT" -n 100 --no-pager
            exit 1
          fi
          echo "Started URL intake worker: $SOURCE_INTAKE_UNIT"

          mkdir -p "$PUBLISHER_DIR"
          tar -xzf /tmp/mobile-publisher.tar.gz -C "$PUBLISHER_DIR"
          cd "$PUBLISHER_DIR"
          npm ci
          npx playwright install --with-deps chromium

          mkdir -p /home/ubuntu/.local/share/aicc-mobile-bg
          sudo install -m 600 /tmp/mobile-publisher.env /etc/aicc-mobile-publisher.env
          rm -f /tmp/dist.tar.gz /tmp/worker.tar.gz /tmp/mobile-publisher.tar.gz /tmp/mobile-publisher.env

          # The Publications publisher is a second, separate worker. It gets its
          # own directory, its own environment file and its own timer, so a
          # problem in one flow cannot stop the other.
          PUBLICATIONS_DIR="$APP_DIR/services/publications-publisher"
          mkdir -p "$PUBLICATIONS_DIR"
          tar -xzf /tmp/publications-publisher.tar.gz -C "$PUBLICATIONS_DIR"
          cd "$PUBLICATIONS_DIR"
          # A separate visible Chromium profile is used for the one-time
          # Mobile.bg sign-in. It is reachable only through localhost VNC.
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify
          mkdir -p /home/ubuntu/.local/share/aicc-publications-chrome
          sudo install -m 600 /tmp/publications.env /etc/aicc-publications.env
          rm -f /tmp/publications-publisher.tar.gz /tmp/publications.env

          SOURCE_KEY=""
          # The service role key may be exported in the unit Environment, or
          # loaded from an EnvironmentFile. Read both: checking only Environment
          # silently misses the common case and left the publisher running with
          # the public key, which cannot see the queue.
          for UNIT_NAME in $(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '$1 ~ /(source|intake|worker|import|publish)/ {print $1}'); do
            UNIT_ENV="$(sudo systemctl show "$UNIT_NAME" --property=Environment --value 2>/dev/null || true)"
            CANDIDATE_KEY="$(printf '%s' "$UNIT_ENV" | tr ' ' '\n' | sed -n 's/^SUPABASE_SERVICE_ROLE_KEY=//p' | head -n 1)"
            if [ -z "$CANDIDATE_KEY" ]; then
              for ENV_FILE in $(sudo systemctl show "$UNIT_NAME" --property=EnvironmentFiles --value 2>/dev/null | tr ' ' '\n' | sed 's/^-//' | awk 'NF'); do
                if [ -r "$ENV_FILE" ]; then
                  CANDIDATE_KEY="$(sudo sed -n 's/^SUPABASE_SERVICE_ROLE_KEY=//p' "$ENV_FILE" | head -n 1)"
                fi
                [ -n "$CANDIDATE_KEY" ] && break
              done
            fi
            if [ -n "$CANDIDATE_KEY" ]; then
              SOURCE_KEY="$CANDIDATE_KEY"
              break
            fi
          done
          if [ -n "$SOURCE_KEY" ]; then
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SOURCE_KEY" | sudo tee -a /etc/aicc-publications.env >/dev/null
            echo "Publications worker will use the service role key from $UNIT_NAME."
          else
            echo "::warning::No SUPABASE_SERVICE_ROLE_KEY found on the server. The publisher will run with the public key and cannot read the queue."
          fi

          NPM_BIN="$(command -v npm)"
          SOURCE_ENV_FILE="$(systemctl show "$SOURCE_INTAKE_UNIT" --property=EnvironmentFiles --value 2>/dev/null | tr ' ' '\n' | sed 's/^-//' | awk 'NF {print; exit}')"
          SOURCE_ENV_LINE=""
          if [ -n "$SOURCE_ENV_FILE" ] && [ -f "$SOURCE_ENV_FILE" ]; then
            SOURCE_ENV_LINE="EnvironmentFile=$SOURCE_ENV_FILE"
          fi
          sudo tee /etc/systemd/system/aicc-mobile-publisher.service >/dev/null <<UNIT
          [Unit]
          Description=Auto Import Control Center Mobile.bg preview publisher
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User=ubuntu
          WorkingDirectory=$PUBLISHER_DIR
          $SOURCE_ENV_LINE
          EnvironmentFile=/etc/aicc-mobile-publisher.env
          ExecStart=$NPM_BIN run run-once
          UNIT

          sudo tee /etc/systemd/system/aicc-mobile-publisher.timer >/dev/null <<UNIT
          [Unit]
          Description=Run Mobile.bg preview publisher for queued jobs

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=60s
          Persistent=true
          Unit=aicc-mobile-publisher.service

          [Install]
          WantedBy=timers.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable --now aicc-mobile-publisher.timer
          if ! sudo systemctl start aicc-mobile-publisher.service; then
            sudo journalctl -u aicc-mobile-publisher.service -n 80 --no-pager
            exit 1
          fi

          # Publications: its own unit and timer, same shape as the one above but
          # pointing at its own directory, its own environment file and its own
          # entry point. Nothing is shared with the «Обяви» publisher.
          NODE_BIN="$(command -v node)"
          sudo tee /etc/systemd/system/aicc-publications.service >/dev/null <<UNIT
          [Unit]
          Description=AICC Publications publisher (self-hosted Chrome first)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User=ubuntu
          WorkingDirectory=$PUBLICATIONS_DIR
          EnvironmentFile=/etc/aicc-publications.env
          ExecStart=$NODE_BIN src/index.mjs drain
          TimeoutStartSec=900
          Nice=10
          UNIT

          sudo tee /etc/systemd/system/aicc-publications.timer >/dev/null <<UNIT
          [Unit]
          Description=Run the AICC publications publisher every minute

          [Timer]
          OnBootSec=2min
          OnUnitActiveSec=60s
          Persistent=true
          Unit=aicc-publications.service

          [Install]
          WantedBy=timers.target
          UNIT

          # The browser display and VNC services are local-only. They do not
          # open a public port and therefore cannot expose the Mobile.bg session.
          sudo tee /etc/systemd/system/aicc-publications-display.service >/dev/null <<UNIT
          [Unit]
          Description=Virtual display for Publications Chrome
          [Service]
          Type=simple
          User=ubuntu
          ExecStart=/usr/bin/Xvfb :99 -screen 0 1440x1000x24 -nolisten tcp
          Restart=always
          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo tee /etc/systemd/system/aicc-publications-browser.service >/dev/null <<UNIT
          [Unit]
          Description=Persistent Publications Chrome profile
          Requires=aicc-publications-display.service
          After=aicc-publications-display.service network-online.target
          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=$PUBLICATIONS_DIR
          Environment=DISPLAY=:99
          EnvironmentFile=/etc/aicc-publications.env
          ExecStart=$NODE_BIN src/local-browser.mjs
          Restart=always
          RestartSec=3
          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo tee /etc/systemd/system/aicc-publications-vnc.service >/dev/null <<UNIT
          [Unit]
          Description=Local-only VNC for Publications Chrome
          Requires=aicc-publications-display.service
          After=aicc-publications-display.service
          [Service]
          Type=simple
          User=ubuntu
          ExecStart=/usr/bin/x11vnc -display :99 -localhost -forever -shared -nopw
          Restart=always
          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo tee /etc/systemd/system/aicc-publications-vnc-web.service >/dev/null <<UNIT
          [Unit]
          Description=Local-only noVNC web view for Publications Chrome
          Requires=aicc-publications-vnc.service
          After=aicc-publications-vnc.service
          [Service]
          Type=simple
          User=ubuntu
          ExecStart=/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
          Restart=always
          [Install]
          WantedBy=multi-user.target
          UNIT

          # Safe transport check only. It receives the same EnvironmentFile as
          # the production worker, so it cannot accidentally run with an empty
          # Supabase configuration. It never fills or submits a listing.
          sudo tee /etc/systemd/system/aicc-publications-browser-test.service >/dev/null <<UNIT
          [Unit]
          Description=AICC Publications self-hosted browser probe
          Requires=aicc-publications-browser.service
          After=aicc-publications-browser.service
          [Service]
          Type=oneshot
          User=ubuntu
          WorkingDirectory=$PUBLICATIONS_DIR
          EnvironmentFile=/etc/aicc-publications.env
          ExecStart=$NODE_BIN src/index.mjs browser-test
          TimeoutStartSec=120
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable --now aicc-publications-display.service aicc-publications-browser.service aicc-publications-vnc.service aicc-publications-vnc-web.service
          if ! sudo systemctl start aicc-publications-browser-test.service; then
            sudo journalctl -u aicc-publications-browser-test.service -n 100 --no-pager
            exit 1
          fi
          echo "Publications browser probe result:"
          sudo journalctl -u aicc-publications-browser-test.service -n 30 --no-pager
          echo "Publications Chrome service state:"
          sudo systemctl --no-pager --full status aicc-publications-browser.service | sed -n '1,25p'

          # The environment file holds the Browser Use token, so a readable
          # permission is a leak. Refuse to start rather than run with it exposed.
          PERM="$(sudo stat -c '%a' /etc/aicc-publications.env)"
          if [ "$PERM" != "600" ]; then
            echo "::error::/etc/aicc-publications.env is mode $PERM, expected 600."
            exit 1
          fi
          if [ -z "$(sudo sed -n 's/^BROWSER_USE_API_KEY=//p' /etc/aicc-publications.env)" ]; then
            echo "::warning::BROWSER_USE_API_KEY is empty in /etc/aicc-publications.env."
          fi

          # The queue and self-hosted Chrome gate must pass first. Until then the
          # publisher is installed but stopped, so no failing run repeats every minute.
          sudo systemctl disable --now aicc-publications.timer || true
          echo "Publications timer is installed but intentionally stopped until queue verification."

          # Expose only the live browser view needed for a one-time manual
          # Mobile.bg sign-in. VNC itself remains localhost-only. Nginx asks the
          # signed Edge Function to validate a 15-minute, Admin-issued ticket
          # before serving the VNC page or WebSocket.
          sudo mkdir -p /etc/nginx/snippets
          sudo tee /etc/nginx/snippets/aicc-publications-browser.conf >/dev/null <<'NGINX'
          location = /publications-browser/vnc.html {
            access_log off;
            auth_request /_aicc_publications_browser_auth;
            proxy_pass http://127.0.0.1:6080/vnc.html;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
          }
          location = /publications-browser/websockify {
            access_log off;
            auth_request /_aicc_publications_browser_auth;
            proxy_pass http://127.0.0.1:6080/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
          }
          # noVNC's static JavaScript/CSS contains no session data. Keeping it
          # public lets the protected vnc.html load relative assets normally.
          location ^~ /publications-browser/ {
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
          }
          location = /_aicc_publications_browser_auth {
            internal;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header apikey "sb_publishable_3szh1-AiAAUYDeVBwO7bJQ_gXhkBU0A";
            proxy_ssl_server_name on;
            proxy_pass https://cgftjqwebvddtsbcbeml.supabase.co/functions/v1/publication-browser-access/validate;
          }
          NGINX
          # Some VPS images use the default server name, so locate the active
          # site by its actual document root rather than by an assumed filename.
          AICC_SITE_CONF="$(sudo nginx -T 2>&1 | awk '/^# configuration file / {p=$4; sub(/:$$/, "", p)} /root[[:space:]]+\\/var\\/www\\/html/ {print p; exit}')"
          if [ -z "$AICC_SITE_CONF" ] || [ ! -f "$AICC_SITE_CONF" ]; then
            for CANDIDATE in /etc/nginx/sites-enabled/default /etc/nginx/sites-available/default; do
              if [ -f "$CANDIDATE" ]; then AICC_SITE_CONF="$CANDIDATE"; break; fi
            done
          fi
          if [ -z "$AICC_SITE_CONF" ] || [ ! -f "$AICC_SITE_CONF" ]; then
            echo "::error::Nginx virtual host serving /var/www/html was not found."
            exit 1
          fi
          sudo cp -p "$AICC_SITE_CONF" "$AICC_SITE_CONF.aicc-browser-backup"
          sudo python3 - "$AICC_SITE_CONF" <<'PY'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding='utf-8').read()
          marker = 'include /etc/nginx/snippets/aicc-publications-browser.conf;'
          if marker not in text:
              selected = None
              for match in re.finditer(r'\\bserver\\s*\\{', text):
                  depth = 0
                  end = None
                  for index in range(match.end() - 1, len(text)):
                      if text[index] == '{':
                          depth += 1
                      elif text[index] == '}':
                          depth -= 1
                          if depth == 0:
                              end = index
                              break
                  block = text[match.start():end] if end is not None else ''
                  if end is not None and (re.search(r'server_name\\s+[^;]*autoimportcontrolcenter\\.biz', block, re.I) or re.search(r'root\\s+\\/var\\/www\\/html', block, re.I)):
                      selected = end
                      break
              if selected is None:
                  raise SystemExit('AICC server block serving the web site was not found in ' + path)
              text = text[:selected] + '\\n    ' + marker + '\\n' + text[selected:]
              open(path, 'w', encoding='utf-8').write(text)
          PY
          if ! sudo nginx -t; then
            sudo cp -p "$AICC_SITE_CONF.aicc-browser-backup" "$AICC_SITE_CONF"
            sudo nginx -t
            exit 1
          fi
          sudo rm -f "$AICC_SITE_CONF.aicc-browser-backup"
          sudo systemctl reload nginx
          REMOTE_SCRIPT

          rm -f mobile-publisher.env publications.env dist.tar.gz worker.tar.gz mobile-publisher.tar.gz publications-publisher.tar.gz

# Automatic deployment enabled
