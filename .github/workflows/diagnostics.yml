name: Diagnostics

# Read-only inspection of the VPS. Prints no secret values, only key names.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Inspect
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' 2>&1 | sed -E \
            -e 's/vps-[0-9a-f]{6,}/<vps>/g' \
            -e 's#/home/[a-z][a-z0-9_-]*#/home/<user>#g' \
            -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g' \
            -e 's#ssh-(ed25519|rsa) [A-Za-z0-9+/=]+#<public key>#g' \
            -e 's/eyJ[A-Za-z0-9._-]{10,}/<key>/g' \
            || true
          echo "############ СЪРВЪР ############"
          date; uptime; echo

          echo "############ УСЛУГИ ############"
          systemctl is-active aicc-mobile-publisher.timer 2>&1 | sed 's/^/timer: /'
          systemctl is-active aicc-mobile-publisher.service 2>&1 | sed 's/^/service: /'
          systemctl is-active source-intake-worker.service 2>&1 | sed 's/^/source-intake: /'
          echo
          systemctl list-timers --all --no-pager 2>/dev/null | head -8
          echo

          echo "############ НАСТРОЙКИ: само имена на ключове ############"
          sudo sed -n 's/^\([A-Z_]*\)=.*/\1/ p' /etc/aicc-mobile-publisher.env 2>/dev/null | sort
          echo "--- има ли служебен ключ (без стойност) ---"
          if sudo grep -q '^SUPABASE_SERVICE_ROLE_KEY=.\+' /etc/aicc-mobile-publisher.env 2>/dev/null; then
            echo "SUPABASE_SERVICE_ROLE_KEY: ДА"
          else
            echo "SUPABASE_SERVICE_ROLE_KEY: НЕ"
          fi
          for N in MOBILE_BG_USERNAME MOBILE_BG_PASSWORD; do
            if sudo grep -q "^$N=.\+" /etc/aicc-mobile-publisher.env 2>/dev/null; then echo "$N: зададен"; else echo "$N: ЛИПСВА"; fi
          done
          echo

          echo "############ ЕДНОКРАТЕН ВХОД: има ли запазен профил ############"
          ls -la /home/ubuntu/.local/share/aicc-mobile-bg 2>&1 | head -10
          echo

          echo "############ ПОСЛЕДНИ 60 РЕДА ОТ ПУБЛИКУВАЩИЯ ############"
          sudo journalctl -u aicc-mobile-publisher.service -n 60 --no-pager 2>&1 | tail -60
          echo

          echo "############ САЙТ ############"
          ls -la /var/www/html/ 2>&1 | head -5
          grep -o 'assets/index-[A-Za-z0-9_-]*\.js' /var/www/html/index.html 2>/dev/null | sed 's/^/сервиран билд: /'
          curl -s -o /dev/null -w 'локален отговор: HTTP %{http_code}\n' http://127.0.0.1/ 2>&1
          echo

          echo "############ ВСИЧКИ НАШИ УСЛУГИ ############"
          systemctl list-units --all --no-pager 2>/dev/null | grep -i "aicc\|intake\|publisher" | sed 's/  */ /g' | cut -c1-120
          echo
          echo "--- таймери ---"
          systemctl list-timers --all --no-pager 2>/dev/null | grep -i "aicc\|intake\|publisher" | sed 's/  */ /g'
          echo

          echo "############ ФАЙЛОВЕ С НАСТРОЙКИ: къде има служебен ключ ############"
          for F in $(sudo ls /etc/aicc*.env 2>/dev/null); do
            printf "  %-40s " "$F"
            if sudo grep -q '^SUPABASE_SERVICE_ROLE_KEY=.\+' "$F" 2>/dev/null; then echo "има служебен ключ"; else echo "няма служебен ключ"; fi
            sudo sed -n 's/^\([A-Z_]*\)=.*/    \1/p' "$F" 2>/dev/null | sort | head -12
          done
          echo

          echo "############ ЛОГОВЕ НА ДРУГАТА УСЛУГА (последни 25) ############"
          UNIT=$(systemctl list-units --all --no-pager 2>/dev/null | grep -io "[a-z0-9@-]*intake[a-z0-9@-]*\.service" | head -1)
          echo "единица: ${UNIT:-не е намерена}"
          if [ -n "$UNIT" ]; then sudo journalctl -u "$UNIT" -n 25 --no-pager 2>&1 | tail -25; fi
          echo

          echo "############ ИМА ЛИ ВЪОБЩЕ НЯКАКВА ЧЕРНОВА ############"
          echo "(броят се вижда само ако работникът има право на четене)"
          sudo journalctl -u aicc-mobile-publisher.service --since "24 hours ago" --no-pager 2>&1 | grep -icE "42501|permission denied|Не мога|грешка" | sed 's/^/грешки за 24 часа: /'
          echo

          echo "############ КАКВО ВРЪЩА MOBILE.BG НА СЪРВЪРА ############"
          echo "(същата заявка, която работникът прави — само се гледа, нищо не се публикува)"
          URL='https://www.mobile.bg/pcgi/mobile.cgi?pubtype=1&act=6&subact=4&actions=1'
          BODY=$(curl -s -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36' -H 'Accept-Language: bg-BG,bg;q=0.9' -w '\n@@HTTP:%{http_code}@@SIZE:%{size_download}' "$URL" 2>&1)
          echo "$BODY" | grep -o '@@HTTP:[0-9]*@@SIZE:[0-9]*' | sed 's/@@/ /g' | sed 's/^/  отговор:/'
          echo "  полетата на формата:"
          for N in f5 f6 f12 f18 f19; do
            printf "    name=\"%s\": " "$N"
            echo "$BODY" | grep -c "name=\"$N\""
          done
          echo "  видим текст:"
          echo "$BODY" | sed -e 's/<[^>]*>/ /g' -e 's/&#39;/'"'"'/g' | tr -s ' \n' ' ' | cut -c1-300 | sed 's/^/    /'
          echo
          echo "  има ли защита:"
          echo "$BODY" | grep -oiE "cloudflare|ddos-guard|captcha|recaptcha|turnstile|technical|технически затруднения|robot" | sort | uniq -c | sed 's/^/    /'
          echo

          echo "############ МОЖЕ ЛИ РАБОТНИКЪТ ДА МИНЕ ПРЕЗ ЗАЩИТАТА ############"
          echo "(фиксираната поправка иска истински Chrome, не вградения Chromium)"
          for B in google-chrome google-chrome-stable chromium chromium-browser; do
            printf "  %-22s " "$B"
            if command -v "$B" >/dev/null 2>&1; then "$B" --version 2>/dev/null || echo "има го"; else echo "липсва"; fi
          done
          echo "  вграден Chromium на Playwright:"
          find "$PUBLISHER_DIR/node_modules/playwright-core/.local-browsers" /home/*/.cache/ms-playwright -maxdepth 1 -name "chromium*" 2>/dev/null | sed 's/^/    /' | head -5
          echo "  версия на Playwright:"
          PUBLISHER_DIR="/home/ubuntu/auto-import-control-center/services/mobile-publisher"
          node -e "console.log('    ' + require('$PUBLISHER_DIR/node_modules/playwright/package.json').version)" 2>/dev/null || echo "    (не може да се прочете)"
          REMOTE